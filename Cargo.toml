[package]
name = "gc-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "gcrust"
path = "src/lib.rs"

[[bin]]
name = "gcr"
path = "src/main.rs"

[dependencies]
# LLVM backend (AOT + JIT) via Inkwell. Same fork/feature ai-lang uses.
inkwell = { git = "https://github.com/jimmyhmiller/inkwell", features = ["llvm21-1"] }
# Unify the backend feature with Inkwell: newer LLVM opcode enums are not ABI compatible.
llvm-sys = { version = "211.0.1", features = ["strict-versioning"] }
# The GC runtime + collector, split into its own LLVM-free crate so AOT binaries
# can statically link just the runtime (libgcrust_rt.a). Used as an rlib by the
# JIT; `build.rs` also produces + locates the profile-matched staticlib for AOT.
gcrust-rt = { path = "crates/gcrust-rt" }
# Structured IR dumps (`gcr emit <stage> --json`): the X-ray taps that let
# tooling/agents inspect every pipeline stage as data instead of reading codegen.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Check the remaining stack before recursive lowering enters its large frames.
stacker = "0.1.25"
toml = "1.1.6"

[workspace]
members = ["crates/gcrust-rt"]
exclude = ["crates/vendor/hashbrown"]

# Pinned allocator-owner leak backport; origin/patch documented with the source.
[patch.crates-io]
hashbrown = { path = "crates/vendor/hashbrown" }
